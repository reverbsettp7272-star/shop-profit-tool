<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>店铺多商品利润统计</title>
  <style>
    :root{--ink:#142b4a;--muted:#687991;--ground:#f3f7fc;--line:#dfe8f4;--blue:#1769e0;--green:#0c8c68;--red:#cf4550}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e8f3ff,var(--ground) 55%,#f9fcff);font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}main{max-width:1140px;margin:auto;padding:32px 20px 50px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.1em}h1{margin:7px 0;font-size:30px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start;margin-top:22px}.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 12px 36px rgba(27,61,108,.08)}h2{margin:0 0 15px;font-size:16px}.section-label{margin:22px 0 11px;color:var(--muted);font-size:13px;font-weight:800}.section-label:first-of-type{margin-top:0}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}.field:last-child{border-bottom:0}.field input,.field select{width:165px;padding:10px;border:1px solid #cbd8e8;border-radius:9px;background:#fff;color:var(--ink);font:inherit;text-align:right;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}.field input[readonly]{background:#f2f6fb;color:#6e7f95}.product-head,.sku-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;margin:10px 0;background:#eff5ff;border-radius:12px;color:#1769e0;font-size:13px;font-weight:800}.sku-head{background:#f1f7f8;color:#087257}.button-group{display:flex;gap:7px}.small-button,button{border:0;border-radius:9px;cursor:pointer;font:700 13px inherit}.small-button{padding:6px 9px;background:#fee4e2;color:#b42318}.copy{background:#e0edff;color:#1769e0}.copy-sku{background:#ddf4ed;color:#087257}.editor{border:1px solid var(--line);border-radius:13px;padding:0 12px;margin:10px 0}.sku-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 0}.sku-grid .field{display:block;padding:9px;border:0;border-radius:9px;background:#f5f8fd}.sku-grid .field span{display:block;color:var(--muted);font-size:11px}.sku-grid .field input{width:100%;margin:5px 0 0;padding:7px 2px 2px;border:0;border-radius:0;border-bottom:1px solid #cbd8e8;background:transparent;font-size:13px}.sku-grid .field input:focus{box-shadow:none;border-bottom-color:var(--blue)}.sku-grid .name-field{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.sku-grid .name-field span{font-size:13px;color:var(--ink)}.sku-grid .name-field input{width:220px;margin:0;padding:7px 4px;text-align:right}.add{width:100%;padding:11px;margin:5px 0;background:#f2fbf8;border:1px dashed var(--green);color:var(--green)}.add-product{border-color:var(--blue);color:var(--blue);background:#f2f6ff}.actions{display:flex;gap:10px;margin-top:20px}.actions button{padding:12px 15px}.reset{background:#eaf0f8;color:#4d617c}.calculate{flex:1;background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(23,105,224,.2)}.summary{position:sticky;top:18px;padding:0;overflow:hidden}.summary-top{padding:22px;background:linear-gradient(145deg,#153b72,#1769e0);color:#fff}.summary.loss .summary-top{background:linear-gradient(145deg,#7d2630,#cf4550)}.summary-title{color:#d7e8ff;font-size:13px;font-weight:700}.profit{margin:7px 0 3px;font-size:34px;font-weight:850;letter-spacing:-.06em}.summary-line{margin-top:7px;color:#e3efff;font-size:12px;line-height:1.55}.summary.loss .summary-title,.summary.loss .summary-line{color:#ffe0e3}.rows{padding:0 21px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.detail{margin-top:18px}.product-result,.sku-result{border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0;background:#fff}.product-result.loss,.sku-result.loss{border-color:#f4b8bd}.result-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800}.result-head small{color:var(--muted);font-weight:500}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{padding:9px;border-radius:9px;background:#f4f8fd}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:3px;font-size:13px}.net{display:flex;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-weight:800;color:var(--green);font-size:13px}.error{padding:18px;color:#b42318;background:#fff0f0;border:1px solid #fecaca;border-radius:13px;font-size:13px}.formula{margin-top:16px;padding:12px;border-radius:10px;background:#f4f8fd;color:#63738a;font-size:12px;line-height:1.7}.record-panel{margin-top:18px}.record-control{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.record-control input{padding:10px;border:1px solid #cbd8e8;border-radius:9px;font:inherit}.save-record{padding:11px 14px;background:var(--blue);color:#fff}.table{overflow:hidden;padding:0;margin-top:11px}.table-head,.table-row{display:grid;align-items:center;gap:8px;padding:11px 14px;font-size:12px}.table-head{background:#f1f6fc;color:#657891;font-weight:800}.table-row{border-top:1px solid var(--line)}.daily-table .table-head,.daily-table .table-row{grid-template-columns:1.2fr 1fr 1fr .6fr}.monthly-table .table-head,.monthly-table .table-row{grid-template-columns:1fr .8fr 1fr 1fr 1fr}.delete-record{padding:5px 8px;background:#fee4e2;color:#b42318;font-size:11px}.empty{margin-top:11px;padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:13px;font-size:13px}@media(max-width:820px){main{padding:24px 14px 38px}.layout{grid-template-columns:1fr}.summary{position:static}h1{font-size:26px}}@media(max-width:380px){.field{align-items:flex-start;flex-direction:column}.field input,.field select{width:100%;text-align:left}.sku-grid{grid-template-columns:1fr}.sku-grid .name-field{grid-column:auto;display:block}.sku-grid .name-field input{width:100%;margin-top:5px;text-align:left}.monthly-table{overflow-x:auto}}
  </style>
</head>
<body>
  <main>
    <header class="intro"><div class="eyebrow">STORE PROFIT TOOL</div><h1>店铺多商品利润统计</h1><p>先选择商品，再编辑 SKU；店铺费用只录入一次。</p></header>
    <div class="layout">
      <section class="card">
        <h2>店铺与商品录入</h2>
        <div class="section-label">店铺固定费用</div>
        <label class="field"><span>月房租水电总额</span><input id="monthlyOverhead" type="number" min="0" step="0.01" value="0"></label>
        <label class="field"><span>每日房租水电（自动）</span><input id="dailyOverhead" type="text" readonly value="0.00"></label>
        <label class="field"><span>店铺费用分摊</span><select id="storeAllocation"><option value="sales">按商品销售额分摊</option><option value="quantity">按商品销量分摊</option></select></label>
        <div class="section-label">当前商品</div>
        <label class="field"><span>选择商品</span><select id="productSelect"></select></label>
        <div id="productEditor"></div>
        <button id="addProduct" class="add add-product" type="button">+ 复制当前商品并新增</button>
        <div class="section-label">当前商品的 SKU</div>
        <label class="field"><span>选择 SKU</span><select id="skuSelect"></select></label>
        <div id="skuEditor"></div>
        <button id="addSku" class="add" type="button">+ 复制当前规格并新增 SKU</button>
        <div class="actions"><button id="reset" class="reset" type="button">重置</button><button id="calculate" class="calculate" type="button">重新计算</button></div>
      </section>
      <aside id="storeSummary" class="card summary" aria-live="polite"></aside>
    </div>
    <section class="detail"><h2>各商品利润</h2><div id="productResults"></div><h2>当前商品的 SKU 利润</h2><div id="skuResults"></div></section>
    <section class="record-panel"><h2>每日记录</h2><div class="card record-control"><label>记录日期 <input id="recordDate" type="date"></label><button id="saveRecord" class="save-record" type="button">保存当天记录</button><span>同一日期再次保存会覆盖当天记录</span></div><div id="dailyTable"></div><h2>每月总表</h2><div id="monthlyTable"></div></section>
    <div class="formula">SKU 实际毛利率 =（售价 − 成本 − 包装 − 运费 − 平台扣点）÷ 售价；SKU/商品保本 ROI = 1 ÷ 实际毛利率。店铺房租水电只录入一次，再分摊到所有商品。</div>
  </main>
  <script>
    const initialProducts = () => [
      {id:'product-1',name:'请输入商品名称',skus:[{id:'p1-sku-1',name:'请输入SKU',price:99,cost:39,packaging:1.5,shipping:8,platformRate:5,quantity:1}],shared:{other:5,adSpend:0},allocation:'sales',activeSkuIndex:0}
    ];
    const localDate=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
    const recordKey='store-profit-daily-records-v1',catalogKey='store-profit-product-catalog-v1';
    const loadRecords=()=>{try{const raw=localStorage.getItem(recordKey);const records=raw?JSON.parse(raw):[];return Array.isArray(records)?records:[];}catch{return[];}};
    const saveRecords=records=>{try{localStorage.setItem(recordKey,JSON.stringify(records));}catch{}};
    const migrateStarterCatalog=products=>{const product=products[0],sku=product&&product.skus&&product.skus[0];return products.length===1&&product&&product.id==='product-1'&&product.name==='示例商品'&&product.skus.length===1&&sku&&sku.id==='p1-sku-1'&&sku.name==='标准款'?[{...product,name:'请输入商品名称',skus:[{...sku,name:'请输入SKU'}]}]:products;};
    const loadCatalog=()=>{try{const raw=localStorage.getItem(catalogKey);const products=raw?JSON.parse(raw):[];return Array.isArray(products)&&products.length&&products.every(p=>Array.isArray(p.skus)&&p.skus.length)?migrateStarterCatalog(products):initialProducts();}catch{return initialProducts();}};
    const saveCatalog=products=>{try{localStorage.setItem(catalogKey,JSON.stringify(products));}catch{}};
    const defaults = () => ({products:loadCatalog(),activeProductIndex:0,store:{monthlyOverhead:0},storeAllocation:'sales',recordDate:localDate(),records:loadRecords()});
    let state=defaults(); const num=value=>Math.max(0,Number.parseFloat(value)||0); const money=value=>`¥ ${value.toFixed(2)}`; const esc=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const storeSummary=document.getElementById('storeSummary'),productResults=document.getElementById('productResults'),skuResults=document.getElementById('skuResults'),dailyTable=document.getElementById('dailyTable'),monthlyTable=document.getElementById('monthlyTable');
    const currentProduct=()=>state.products[state.activeProductIndex];
    function compute(){
      const prepared=[]; for(let pi=0;pi<state.products.length;pi+=1){const product=state.products[pi],skus=[];for(let si=0;si<product.skus.length;si+=1){const sku=product.skus[si],price=num(sku.price),cost=num(sku.cost),pack=num(sku.packaging),ship=num(sku.shipping),rate=num(sku.platformRate),qty=num(sku.quantity);if(price<=0||qty<=0)return{error:`请完善第 ${pi+1} 个商品的 SKU ${si+1}。`};const fee=price*rate/100,unitCost=cost+pack+ship+fee,unitGross=price-unitCost,sales=price*qty;skus.push({...sku,price,qty,sales,unitCost,unitGross,grossMargin:unitGross/price,grossProfit:unitGross*qty});}const sales=skus.reduce((s,x)=>s+x.sales,0),quantity=skus.reduce((s,x)=>s+x.qty,0),grossProfit=skus.reduce((s,x)=>s+x.grossProfit,0);prepared.push({...product,skus,sales,quantity,grossProfit,productOperatingCost:num(product.shared.other)+num(product.shared.adSpend)});}
      const totalSales=prepared.reduce((s,x)=>s+x.sales,0),totalQuantity=prepared.reduce((s,x)=>s+x.quantity,0),totalGrossProfit=prepared.reduce((s,x)=>s+x.grossProfit,0),productOperatingCost=prepared.reduce((s,x)=>s+x.productOperatingCost,0),dailyOverhead=num(state.store.monthlyOverhead)/30,base=state.storeAllocation==='sales'?totalSales:totalQuantity;
      const products=prepared.map(product=>{const weight=state.storeAllocation==='sales'?product.sales:product.quantity,storeCost=base?dailyOverhead*weight/base:0,skuBase=product.allocation==='sales'?product.sales:product.quantity,skuResults=product.skus.map(sku=>{const skuWeight=product.allocation==='sales'?sku.sales:sku.qty,productCost=skuBase?product.productOperatingCost*skuWeight/skuBase:0,skuStoreCost=skuBase?storeCost*skuWeight/skuBase:0;return{...sku,productCost,storeCost:skuStoreCost,netProfit:sku.grossProfit-productCost-skuStoreCost};});const netProfit=product.grossProfit-product.productOperatingCost-storeCost;return{...product,storeCost,netProfit,grossMargin:product.grossProfit/product.sales,skuResults};});
      const grossMargin=totalSales?totalGrossProfit/totalSales:0,netProfit=totalGrossProfit-productOperatingCost-dailyOverhead;return{dailyOverhead,totalSales,totalGrossProfit,productOperatingCost,grossMargin,netProfit,totalCost:totalSales-totalGrossProfit+productOperatingCost+dailyOverhead,products};
    }
    const field=(label,name,value,type='number')=>`<label class="field ${name==='name'?'name-field':''}"><span>${label}</span><input type="${type}" data-field="${name}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''}></label>`;
    function renderEditors(){const product=currentProduct(),pSelect=document.getElementById('productSelect'),sSelect=document.getElementById('skuSelect');pSelect.innerHTML=state.products.map((p,i)=>`<option value="${i}">${esc(p.name||`商品 ${i+1}`)}</option>`).join('');pSelect.value=state.activeProductIndex;sSelect.innerHTML=product.skus.map((sku,i)=>`<option value="${i}">${esc(sku.name||`SKU ${i+1}`)}</option>`).join('');sSelect.value=product.activeSkuIndex;document.getElementById('monthlyOverhead').value=state.store.monthlyOverhead;document.getElementById('dailyOverhead').value=(num(state.store.monthlyOverhead)/30).toFixed(2);document.getElementById('storeAllocation').value=state.storeAllocation;document.getElementById('productEditor').innerHTML=`<div class="product-head"><span>商品 ${state.activeProductIndex+1}</span><span class="button-group"><button id="copyProduct" class="small-button copy" type="button">复制商品</button><button id="deleteProduct" class="small-button" type="button">删除</button></span></div>${field('商品名称','name',product.name,'text')}<div class="section-label">当前商品运营费用</div>${field('其他费用（本商品）','other',product.shared.other)}${field('付费投流（本商品）','adSpend',product.shared.adSpend)}<label class="field"><span>SKU 费用分摊</span><select id="skuAllocation"><option value="sales">按 SKU 销售额分摊</option><option value="quantity">按 SKU 销量分摊</option></select></label>`;document.getElementById('skuAllocation').value=product.allocation;const sku=product.skus[product.activeSkuIndex];document.getElementById('skuEditor').innerHTML=`<div class="sku-head"><span>SKU ${product.activeSkuIndex+1}</span><span class="button-group"><button id="copySku" class="small-button copy-sku" type="button">复制</button><button id="deleteSku" class="small-button" type="button">删除</button></span></div><div class="sku-grid">${field('规格名称','name',sku.name,'text')}${field('销售单价 / 件','price',sku.price)}${field('成本价 / 件','cost',sku.cost)}${field('包装费 / 件','packaging',sku.packaging)}${field('运费 / 件','shipping',sku.shipping)}${field('平台扣点率（%）','platformRate',sku.platformRate)}${field('本次销量','quantity',sku.quantity)}</div>`;
      document.getElementById('recordDate').value=state.recordDate;document.querySelectorAll('#productEditor input[data-field]').forEach(input=>input.addEventListener('input',e=>{const f=e.target.dataset.field;if(f==='name'){product.name=e.target.value;pSelect.options[state.activeProductIndex].text=product.name||`商品 ${state.activeProductIndex+1}`;}else product.shared[f]=e.target.value;renderResults();}));document.querySelectorAll('#skuEditor input[data-field]').forEach(input=>input.addEventListener('input',e=>{sku[e.target.dataset.field]=e.target.value;if(e.target.dataset.field==='name')sSelect.options[product.activeSkuIndex].text=sku.name||`SKU ${product.activeSkuIndex+1}`;renderResults();}));document.getElementById('skuAllocation').addEventListener('change',e=>{product.allocation=e.target.value;renderResults();});document.getElementById('copyProduct').addEventListener('click',()=>addProduct());document.getElementById('deleteProduct').addEventListener('click',()=>removeProduct());document.getElementById('copySku').addEventListener('click',()=>duplicateSku());document.getElementById('deleteSku').addEventListener('click',()=>removeSku());}
    function renderResults(){saveCatalog(state.products);const out=compute();if(out.error){storeSummary.classList.remove('loss');storeSummary.innerHTML=`<div class="error">${out.error}</div>`;productResults.innerHTML='';skuResults.innerHTML='';return;}const roi=out.grossMargin>0?(1/out.grossMargin).toFixed(2):'未保本',netMargin=out.totalSales?out.netProfit/out.totalSales*100:0;storeSummary.classList.toggle('loss',out.netProfit<0);storeSummary.innerHTML=`<div class="summary-top"><div class="summary-title">店铺总计 · ${out.products.length} 个商品</div><div class="profit">${out.netProfit<0?'−':''}${money(Math.abs(out.netProfit))}</div><div class="summary-line">店铺净利率 ${netMargin.toFixed(2)}%</div><div class="summary-line">店铺总毛利 ${money(out.totalGrossProfit)} · 商品运营费用 ${money(out.productOperatingCost)}</div><div class="summary-line">店铺实际毛利率 ${(out.grossMargin*100).toFixed(2)}%</div><div class="summary-line">店铺保本 ROI <b>${roi}</b></div></div><div class="rows"><div class="row"><span>店铺总销售额</span><strong>${money(out.totalSales)}</strong></div><div class="row"><span>每日房租水电</span><strong>${money(out.dailyOverhead)}</strong></div><div class="row"><span>店铺总成本</span><strong>${money(out.totalCost)}</strong></div></div>`;productResults.innerHTML=out.products.map(p=>`<article class="product-result ${p.netProfit<0?'loss':''}"><div class="result-head"><span>${esc(p.name)}</span><small>${p.skus.length} 个 SKU · 毛利率 ${(p.grossMargin*100).toFixed(2)}%</small></div><div class="metrics"><div class="metric"><span>商品销售额</span><strong>${money(p.sales)}</strong></div><div class="metric"><span>商品毛利</span><strong>${money(p.grossProfit)}</strong></div><div class="metric"><span>商品运营费用</span><strong>−${money(p.productOperatingCost)}</strong></div><div class="metric"><span>店铺费用分摊</span><strong>−${money(p.storeCost)}</strong></div></div><div class="net"><span>商品净利润</span><span>${money(p.netProfit)}</span></div></article>`).join('');const current=out.products[state.activeProductIndex];skuResults.innerHTML=current.skuResults.map(s=>`<article class="sku-result ${s.netProfit<0?'loss':''}"><div class="result-head"><span>${esc(s.name)}</span><small>销量 ${s.qty}</small></div><div class="metrics"><div class="metric"><span>实际毛利率</span><strong>${(s.grossMargin*100).toFixed(2)}%</strong></div><div class="metric"><span>保本 ROI</span><strong>${s.grossMargin>0?(1/s.grossMargin).toFixed(2):'未保本'}</strong></div><div class="metric"><span>单件商品毛利</span><strong>${money(s.unitGross)}</strong></div><div class="metric"><span>SKU 商品毛利</span><strong>${money(s.grossProfit)}</strong></div><div class="metric"><span>商品费用分摊</span><strong>−${money(s.productCost)}</strong></div><div class="metric"><span>店铺费用分摊</span><strong>−${money(s.storeCost)}</strong></div></div><div class="net"><span>SKU 净利润</span><span>${money(s.netProfit)}</span></div></article>`).join('');}
    function renderRecords(){const records=[...state.records].sort((a,b)=>b.date.localeCompare(a.date));if(!records.length){dailyTable.innerHTML='<div class="empty">还没有保存每日记录。</div>';monthlyTable.innerHTML='<div class="empty">保存每日记录后，这里会自动生成每月总表。</div>';return;}dailyTable.innerHTML=`<div class="card table daily-table"><div class="table-head"><span>日期</span><span>销售额</span><span>净利润</span><span>操作</span></div>${records.map(r=>`<div class="table-row"><span>${r.date}</span><span>${money(Number(r.sales))}</span><span>${money(Number(r.netProfit))}</span><button class="delete-record" data-record-date="${r.date}" type="button">删除</button></div>`).join('')}</div>`;const groups={};records.forEach(r=>{const month=r.date.slice(0,7);if(!groups[month])groups[month]={month,days:0,sales:0,grossProfit:0,totalCost:0,netProfit:0};const item=groups[month];item.days+=1;item.sales+=Number(r.sales);item.grossProfit+=Number(r.grossProfit);item.totalCost+=Number(r.totalCost);item.netProfit+=Number(r.netProfit);});const months=Object.values(groups).sort((a,b)=>b.month.localeCompare(a.month));monthlyTable.innerHTML=`<div class="card table monthly-table"><div class="table-head"><span>月份</span><span>天数</span><span>销售额</span><span>毛利</span><span>净利润</span></div>${months.map(m=>`<div class="table-row"><span>${m.month}</span><span>${m.days} 天</span><span>${money(m.sales)}</span><span>${money(m.grossProfit)}</span><span>${money(m.netProfit)}</span></div>`).join('')}</div>`;document.querySelectorAll('[data-record-date]').forEach(button=>button.addEventListener('click',e=>{state.records=state.records.filter(r=>r.date!==e.target.dataset.recordDate);saveRecords(state.records);renderRecords();}));}
    function saveDailyRecord(){const out=compute();if(out.error){renderResults();return;}const record={date:state.recordDate,productCount:out.products.length,sales:out.totalSales,grossProfit:out.totalGrossProfit,totalCost:out.totalCost,netProfit:out.netProfit};state.records=[...state.records.filter(r=>r.date!==record.date),record];saveRecords(state.records);renderRecords();}
    function cloneProduct(source,index){return{...source,id:`product-${Date.now()}-${index}`,name:`${source.name||'商品'} 副本`,skus:source.skus.map((sku,i)=>({...sku,id:`sku-${Date.now()}-${i}`})),activeSkuIndex:0};}function addProduct(){state.products.push(cloneProduct(currentProduct(),state.products.length));state.activeProductIndex=state.products.length-1;render();}function removeProduct(){if(state.products.length===1)return;state.products.splice(state.activeProductIndex,1);state.activeProductIndex=Math.max(0,state.activeProductIndex-1);render();}function duplicateSku(){const p=currentProduct(),i=p.activeSkuIndex,source=p.skus[i];p.skus.splice(i+1,0,{...source,id:`sku-${Date.now()}`,name:`${source.name||'SKU'} 副本`,quantity:1});p.activeSkuIndex=i+1;render();}function removeSku(){const p=currentProduct();if(p.skus.length===1)return;p.skus.splice(p.activeSkuIndex,1);p.activeSkuIndex=Math.max(0,p.activeSkuIndex-1);render();}function render(){renderEditors();renderResults();renderRecords();}
    document.getElementById('productSelect').addEventListener('change',e=>{state.activeProductIndex=Number(e.target.value);render();});document.getElementById('skuSelect').addEventListener('change',e=>{currentProduct().activeSkuIndex=Number(e.target.value);render();});document.getElementById('monthlyOverhead').addEventListener('input',e=>{state.store.monthlyOverhead=e.target.value;document.getElementById('dailyOverhead').value=(num(e.target.value)/30).toFixed(2);renderResults();});document.getElementById('storeAllocation').addEventListener('change',e=>{state.storeAllocation=e.target.value;renderResults();});document.getElementById('addProduct').addEventListener('click',addProduct);document.getElementById('addSku').addEventListener('click',()=>{const p=currentProduct(),source=p.skus[p.activeSkuIndex];p.skus.push({...source,id:`sku-${Date.now()}`,name:`${source.name||'SKU'} 副本`,quantity:1});p.activeSkuIndex=p.skus.length-1;render();});document.getElementById('calculate').addEventListener('click',renderResults);document.getElementById('recordDate').addEventListener('change',e=>{state.recordDate=e.target.value;});document.getElementById('saveRecord').addEventListener('click',saveDailyRecord);document.getElementById('reset').addEventListener('click',()=>{state=defaults();render();});render();
  </script>
</body>
</html>
